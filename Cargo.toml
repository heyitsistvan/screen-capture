[package]
name = "screen-capture"
version = "0.3.0"
edition = "2021"
description = "Lightshot-style screen capture for Windows and Linux: region screenshots, annotations, clipboard and GIF/MP4 recording"
license = "MIT"
authors = ["Pixobit Solutions"]
homepage = "https://pixobit.eu"
repository = "https://github.com/heyitsistvan/screen-capture"
build = "build.rs"

[dependencies]
bytemuck = "1"
color_quant = "1.1"
fontdue = "0.9"
gif = "0.13"
png = "0.17"
rayon = "1.10"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# WinRT projections for the OCR engine built into Windows, and the Media
# Foundation interfaces for MP4 recording.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Media_MediaFoundation",
    "Win32_System_WinRT",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = "0.3"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
notify-rust = "4"
# H.264 for MP4 recording (Linux has no system encoder to rely on); compiled
# from source, so building needs a C++ compiler.
openh264 = { version = "0.9", default-features = false, features = ["source"] }
pipewire = "0.8"
softbuffer = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
winit = "0.30"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

[build-dependencies]
embed-resource = "2.5"
png = "0.17"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image processing is painfully slow unoptimized; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
