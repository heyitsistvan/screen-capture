[package]
name = "screen-capture"
version = "0.1.0"
edition = "2021"
description = "Lightshot-style screen capture for Windows: region screenshots, annotations, clipboard and GIF recording"
license = "MIT"
build = "build.rs"

[dependencies]
bytemuck = "1"
color_quant = "1.1"
fontdue = "0.9"
gif = "0.13"
png = "0.17"
rayon = "1.10"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# WinRT projections, only for the OCR engine built into Windows.
[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2.5"
png = "0.17"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image processing is painfully slow unoptimized; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
